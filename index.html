<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottle Bakery</title>
<style>
  :root{
    --cocoa:#3a2417;
    --cocoa-soft:#7a5a45;
    --cream:#fff8f0;
    --accent:#d9834f;
    --skin:#f2c294;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--cream);
    color:var(--cocoa);
    overflow-x:hidden;
  }
  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    background:linear-gradient(180deg, #fff8f0 0%, #f7e9d8 100%);
  }
  .chef-svg{
    width:230px;
    height:auto;
  }
  .greeting{
    font-size:26px;
    font-weight:600;
    margin-top:6px;
    opacity:0;
    animation:fadeUp 1s ease forwards 0.4s;
  }
  .subtext{
    font-size:15px;
    color:var(--cocoa-soft);
    margin-top:8px;
    max-width:320px;
    opacity:0;
    animation:fadeUp 1s ease forwards 0.8s;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(15px);}
    to{opacity:1; transform:translateY(0);}
  }
  .enter-btn{
    margin-top:26px;
    padding:14px 32px;
    background:var(--cocoa);
    color:var(--cream);
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    opacity:0;
    animation:fadeUp 1s ease forwards 1.2s;
  }
  .video-note{
    margin-top:22px;
    font-size:11px;
    color:var(--cocoa-soft);
    opacity:0.6;
  }
</style>
</head>
<body>

<div class="hero">
  <svg class="chef-svg" viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">

    <!-- left arm (static) -->
    <g transform="translate(52,125)">
      <g transform="rotate(15)">
        <rect x="-9" y="0" width="18" height="65" rx="9" fill="var(--skin)" stroke="var(--cocoa)" stroke-width="2.5"/>
        <circle cx="0" cy="65" r="10" fill="var(--skin)" stroke="var(--cocoa)" stroke-width="2.5"/>
      </g>
    </g>

    <!-- right arm (waving) -->
    <g transform="translate(148,125)">
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="15;60;15" dur="1.1s" repeatCount="indefinite"/>
        <rect x="-9" y="0" width="18" height="65" rx="9" fill="var(--skin)" stroke="var(--cocoa)" stroke-width="2.5"/>
        <circle cx="0" cy="65" r="10" fill="var(--skin)" stroke="var(--cocoa)" stroke-width="2.5"/>
      </g>
    </g>

    <!-- legs -->
    <rect x="75" y="218" width="20" height="48" rx="6" fill="#ffffff" stroke="var(--cocoa)" stroke-width="2.5"/>
    <rect x="105" y="218" width="20" height="48" rx="6" fill="#ffffff" stroke="var(--cocoa)" stroke-width="2.5"/>
    <ellipse cx="85" cy="270" rx="17" ry="10" fill="var(--cocoa)"/>
    <ellipse cx="115" cy="270" rx="17" ry="10" fill="var(--cocoa)"/>

    <!-- torso / jacket -->
    <rect x="55" y="118" width="90" height="100" rx="28" fill="#ffffff" stroke="var(--cocoa)" stroke-width="2.5"/>
    <!-- apron band -->
    <rect x="55" y="185" width="90" height="33" rx="14" fill="var(--accent)" stroke="var(--cocoa)" stroke-width="2.5"/>
    <!-- buttons -->
    <circle cx="100" cy="138" r="3.5" fill="var(--cocoa)"/>
    <circle cx="100" cy="155" r="3.5" fill="var(--cocoa)"/>
    <circle cx="100" cy="172" r="3.5" fill="var(--cocoa)"/>

    <!-- neckerchief -->
    <path d="M83,118 L117,118 L100,138 Z" fill="var(--accent)" stroke="var(--cocoa)" stroke-width="2.5"/>

    <!-- head -->
    <circle cx="100" cy="85" r="34" fill="var(--skin)" stroke="var(--cocoa)" stroke-width="2.5"/>

    <!-- ears -->
    <circle cx="66" cy="88" r="7" fill="var(--skin)" stroke="var(--cocoa)" stroke-width="2.5"/>
    <circle cx="134" cy="88" r="7" fill="var(--skin)" stroke="var(--cocoa)" stroke-width="2.5"/>

    <!-- eyebrows -->
    <path d="M78,72 Q85,66 92,71" fill="none" stroke="var(--cocoa)" stroke-width="3" stroke-linecap="round"/>
    <path d="M108,71 Q115,66 122,72" fill="none" stroke="var(--cocoa)" stroke-width="3" stroke-linecap="round"/>

    <!-- eyes -->
    <ellipse cx="85" cy="83" rx="4" ry="5.5" fill="var(--cocoa)"/>
    <ellipse cx="115" cy="83" rx="4" ry="5.5" fill="var(--cocoa)"/>

    <!-- cheeks -->
    <ellipse cx="76" cy="98" rx="8" ry="5" fill="#e8886b" opacity="0.35"/>
    <ellipse cx="124" cy="98" rx="8" ry="5" fill="#e8886b" opacity="0.35"/>

    <!-- mustache -->
    <path d="M75,100 Q88,92 100,99 Q112,92 125,100 Q118,112 100,106 Q82,112 75,100 Z"
          fill="#6b4630" stroke="var(--cocoa)" stroke-width="2"/>

    <!-- smile -->
    <path d="M90,110 Q100,118 110,110" fill="none" stroke="var(--cocoa)" stroke-width="3" stroke-linecap="round"/>

    <!-- hat -->
    <ellipse cx="100" cy="30" rx="36" ry="24" fill="#ffffff" stroke="var(--cocoa)" stroke-width="2.5"/>
    <rect x="60" y="44" width="80" height="15" rx="7.5" fill="#ffffff" stroke="var(--cocoa)" stroke-width="2.5"/>

  </svg>

  <div class="greeting">Hello there! Welcome to Bottle Bakery</div>
  <div class="subtext">Freshly baked, always with a smile. Step in and see what we're baking today.</div>
  <button class="enter-btn" onclick="alert('This would take you to the menu page next.')">Enter the Bakery</button>

  <div class="video-note">Placeholder animation — real video coming soon</div>
</div>

</body>
</html>
