<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottle Bakery</title>
<style>
  :root{
    --cocoa:#3a2417;
    --cocoa-soft:#7a5a45;
    --cream:#fff8f0;
    --accent:#d9834f;
    --skin:#f2c294;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--cream);
    color:var(--cocoa);
    overflow-x:hidden;
  }
  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    background:linear-gradient(180deg, #fff8f0 0%, #f7e9d8 100%);
  }

  .chef{
    position:relative;
    width:200px;
    height:280px;
  }
  .chef-hat{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:110px; height:55px;
    background:#fff;
    border:2.5px solid var(--cocoa);
    border-radius:50% 50% 10px 10px / 70% 70% 10px 10px;
    z-index:3;
  }
  .chef-head{
    position:absolute;
    top:38px; left:50%;
    transform:translateX(-50%);
    width:80px; height:80px;
    background:var(--skin);
    border:2.5px solid var(--cocoa);
    border-radius:50%;
    z-index:2;
  }
  .chef-face-feature{ position:absolute; }
  .eye-l{ top:36px; left:24px; width:6px; height:8px; background:var(--cocoa); border-radius:50%; }
  .eye-r{ top:36px; right:24px; width:6px; height:8px; background:var(--cocoa); border-radius:50%; }
  .cheek-l{ top:48px; left:10px; width:14px; height:8px; background:#e8886b; opacity:0.35; border-radius:50%; }
  .cheek-r{ top:48px; right:10px; width:14px; height:8px; background:#e8886b; opacity:0.35; border-radius:50%; }
  .mustache{
    top:52px; left:50%; transform:translateX(-50%);
    width:44px; height:14px;
    background:#6b4630;
    border-radius:0 0 50% 50%;
  }
  .smile{
    top:62px; left:50%; transform:translateX(-50%);
    width:20px; height:10px;
    border-bottom:3px solid var(--cocoa);
    border-radius:0 0 50% 50%;
  }

  .chef-torso{
    position:absolute;
    top:108px; left:50%;
    transform:translateX(-50%);
    width:110px; height:110px;
    background:#fff;
    border:2.5px solid var(--cocoa);
    border-radius:30px;
    z-index:1;
  }
  .apron{
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:110px; height:36px;
    background:var(--accent);
    border:2.5px solid var(--cocoa);
    border-radius:0 0 16px 16px;
  }
  .button{
    position:absolute; left:50%; transform:translateX(-50%);
    width:7px; height:7px; background:var(--cocoa); border-radius:50%;
  }
  .b1{ top:14px; } .b2{ top:32px; } .b3{ top:50px; }

  .leg{
    position:absolute;
    top:216px;
    width:22px; height:50px;
    background:#fff;
    border:2.5px solid var(--cocoa);
    border-radius:8px;
  }
  .leg-l{ left:66px; }
  .leg-r{ left:112px; }
  .shoe{
    position:absolute; top:262px;
    width:34px; height:18px;
    background:var(--cocoa);
    border-radius:10px;
  }
  .shoe-l{ left:60px; }
  .shoe-r{ left:106px; }

  .arm{
    position:absolute;
    top:112px;
    width:20px; height:70px;
    background:var(--skin);
    border:2.5px solid var(--cocoa);
    border-radius:10px;
    z-index:0;
  }
  .arm-l{
    left:36px;
    transform-origin:top center;
    transform:rotate(-15deg);
  }
  .arm-r{
    right:36px;
    transform-origin:top center;
    animation:wave 1.1s ease-in-out infinite;
  }
  @keyframes wave{
    0%   { transform:rotate(15deg); }
    50%  { transform:rotate(60deg); }
    100% { transform:rotate(15deg); }
  }

  .greeting{
    font-size:26px;
    font-weight:600;
    margin-top:16px;
    opacity:0;
    animation:fadeUp 1s ease forwards 0.4s;
  }
  .subtext{
    font-size:15px;
    color:var(--cocoa-soft);
    margin-top:8px;
    max-width:320px;
    opacity:0;
    animation:fadeUp 1s ease forwards 0.8s;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(15px);}
    to{opacity:1; transform:translateY(0);}
  }
  .enter-btn{
    margin-top:26px;
    padding:14px 32px;
    background:var(--cocoa);
    color:var(--cream);
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    opacity:0;
    animation:fadeUp 1s ease forwards 1.2s;
  }
  .video-note{
    margin-top:22px;
    font-size:11px;
    color:var(--cocoa-soft);
    opacity:0.6;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="chef">
    <div class="chef-hat"></div>
    <div class="chef-head">
      <div class="chef-face-feature eye-l"></div>
      <div class="chef-face-feature eye-r"></div>
      <div class="chef-face-feature cheek-l"></div>
      <div class="chef-face-feature cheek-r"></div>
      <div class="chef-face-feature mustache"></div>
      <div class="chef-face-feature smile"></div>
    </div>
    <div class="arm arm-l"></div>
    <div class="arm arm-r"></div>
    <div class="chef-torso">
      <div class="button b1"></div>
      <div class="button b2"></div>
      <div class="button b3"></div>
      <div class="apron"></div>
    </div>
    <div class="leg leg-l"></div>
    <div class="leg leg-r"></div>
    <div class="shoe shoe-l"></div>
    <div class="shoe shoe-r"></div>
  </div>

  <div class="greeting">Hello there! Welcome to Bottle Bakery</div>
  <div class="subtext">Freshly baked, always with a smile. Step in and see what we're baking today.</div>
  <button class="enter-btn" onclick="alert('This would take you to the menu page next.')">Enter the Bakery</button>

  <div class="video-note">Placeholder animation — real video coming soon</div>
</div>

</body>
</html>
